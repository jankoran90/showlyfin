name: Setup
description: "Setup the environment for Showlyfin builds"

runs:
  using: "composite"
  steps:
    # Verze v5/v4 běží na Node.js 24. Starší (setup-java@v4, setup-android@v3) cílí na Node.js 20,
    # který GitHub 2025-09-19 označil za doživší — runner je stejně nutí na Node 24 a u každého běhu
    # to hlásí varováním. Zvednuto 2026-08-01 (verze ověřeny u zdroje přes GitHub API, ne odhadem).
    - name: Setup JDK
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
        cache: gradle
    - name: Set versions
      shell: bash
      run: echo "BUILD_TOOLS_VERSION=36.0.0" >> $GITHUB_ENV
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: "tools platform-tools build-tools;${{ env.BUILD_TOOLS_VERSION }}"
